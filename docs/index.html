<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>WeekWeave email confirmation</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #1d2433; background: #eef3f8; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
      main { width: min(34rem, 100%); padding: 2rem; border: 1px solid #d5dfeb; border-radius: 1.25rem; background: #ffffffee; box-shadow: 0 1.5rem 4rem #1d243326; }
      h1 { margin-top: 0; }
      p { line-height: 1.5; }
      a { display: inline-block; margin-top: 1rem; padding: .75rem 1rem; border-radius: .65rem; color: #fff; background: #3867c8; text-decoration: none; font-weight: 700; }
      @media (prefers-color-scheme: dark) {
        :root { color: #eef3f8; background: #121923; }
        main { border-color: #34465b; background: #1c2735ee; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WeekWeave email confirmed</h1>
      <p>Your account email has been confirmed. Return to the WeekWeave Android app and sign in with your email and password.</p>
      <a href="/weekweave-oauth-consent/oauth/consent/">Open WeekWeave authorization</a>
    </main>
  </body>
</html>
