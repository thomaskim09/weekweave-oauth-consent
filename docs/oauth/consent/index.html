<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>WeekWeave authorization</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #1d2433; background: #eef3f8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
      main { width: min(36rem, 100%); padding: 2rem; border: 1px solid #d5dfeb; border-radius: 1.25rem; background: #ffffffee; box-shadow: 0 1.5rem 4rem #1d243326; }
      h1 { margin: 0 0 .5rem; font-size: clamp(1.5rem, 5vw, 2rem); }
      p { line-height: 1.5; }
      #status { min-height: 1.5rem; }
      #details { margin-top: 1.25rem; padding: 1rem; border-radius: .85rem; background: #f3f7fb; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: .75rem 1rem; margin: 0; overflow-wrap: anywhere; }
      dt { font-weight: 700; }
      dd { margin: 0; }
      form { display: grid; gap: .75rem; margin-top: 1rem; }
      label { display: grid; gap: .35rem; font-weight: 650; }
      input { width: 100%; border: 1px solid #bac9d8; border-radius: .6rem; padding: .7rem .8rem; font: inherit; background: #fff; color: inherit; }
      .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
      button { cursor: pointer; border: 0; border-radius: .65rem; padding: .75rem 1rem; font: inherit; font-weight: 700; }
      button:disabled { cursor: wait; opacity: .6; }
      #approve, #sign-in { color: #fff; background: #3867c8; }
      #deny { color: #1d2433; background: #dce5ee; }
      .back { display: inline-block; color: #3867c8; font-weight: 700; }
      .error { color: #a42d35; }
      @media (prefers-color-scheme: dark) {
        :root { color: #eef3f8; background: #121923; }
        main { border-color: #34465b; background: #1c2735ee; }
        #details { background: #263548; }
        input { border-color: #4b6078; background: #172230; }
        #deny { color: #eef3f8; background: #34465b; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WeekWeave authorization</h1>
      <p id="status" role="status">Checking your sign-in…</p>
      <form id="sign-in-form" hidden>
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button id="sign-in" type="submit">Sign in</button>
      </form>
      <section id="details" hidden>
        <dl>
          <dt>Client</dt><dd id="client"></dd>
          <dt>Redirect URI</dt><dd id="redirect"></dd>
          <dt>Requested scopes</dt><dd id="scope"></dd>
        </dl>
      </section>
      <div id="actions" class="actions"></div>
    </main>
    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const supabase = createClient(
        "https://npfhntukhhrgovnchfrg.supabase.co",
        "sb_publishable_t9QUeuyUYVdEsEItVBr4hA_ihtqeQx8",
        { auth: { autoRefreshToken: true, detectSessionInUrl: true, persistSession: true } },
      );
      const url = new URL(location.href);
      const authorizationId = url.searchParams.get("authorization_id") ??
        sessionStorage.getItem("weekweave_authorization_id");
      const status = document.querySelector("#status");
      const form = document.querySelector("#sign-in-form");
      const email = document.querySelector("#email");
      const password = document.querySelector("#password");
      const details = document.querySelector("#details");
      const actions = document.querySelector("#actions");

      const showError = (message) => {
        status.textContent = message;
        status.className = "error";
      };

      const showSignIn = () => {
        status.textContent = "Sign in to review the WeekWeave access request.";
        form.hidden = false;
        email.focus();
      };

      const showMissingRequest = () => {
        status.textContent = "This is the WeekWeave MCP authorization page. Open it from ChatGPT, or return to the app after confirming your email.";
        status.className = "error";
        const back = document.createElement("a");
        back.className = "back";
        back.href = "/weekweave-oauth-consent/";
        back.textContent = "Back to the email confirmation page";
        actions.append(back);
      };

      const loadAuthorization = async () => {
        const { data: authorization, error } =
          await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
        if (error || !authorization) {
          showError(error?.message ?? "This authorization request is invalid or expired.");
          return;
        }
        if (!("authorization_id" in authorization) && authorization.redirect_url) {
          location.replace(authorization.redirect_url);
          return;
        }
        status.textContent = "Review the requested access before continuing.";
        details.hidden = false;
        document.querySelector("#client").textContent = authorization.client?.name || "WeekWeave client";
        document.querySelector("#redirect").textContent = authorization.redirect_uri || "Not provided";
        document.querySelector("#scope").textContent = authorization.scope || "Not provided";
        const approve = document.createElement("button");
        approve.id = "approve";
        approve.textContent = "Approve";
        approve.addEventListener("click", () => decide("approve"));
        const deny = document.createElement("button");
        deny.id = "deny";
        deny.textContent = "Deny";
        deny.addEventListener("click", () => decide("deny"));
        actions.append(approve, deny);
      };

      const decide = async (decision) => {
        actions.querySelectorAll("button").forEach((button) => button.disabled = true);
        status.textContent = decision === "approve" ? "Approving…" : "Denying…";
        const method = decision === "approve" ? "approveAuthorization" : "denyAuthorization";
        const { data, error } = await supabase.auth.oauth[method](authorizationId);
        if (error || !data?.redirect_url) {
          showError(error?.message ?? "The authorization response was incomplete.");
          actions.querySelectorAll("button").forEach((button) => button.disabled = false);
          return;
        }
        sessionStorage.removeItem("weekweave_authorization_id");
        location.replace(data.redirect_url);
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        form.querySelector("button").disabled = true;
        status.textContent = "Signing in…";
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email.value.trim(),
          password: password.value,
        });
        if (error || !data.session) {
          showError(error?.message ?? "Sign-in did not create a session.");
          form.querySelector("button").disabled = false;
          return;
        }
        form.hidden = true;
        await loadAuthorization();
      });

      const main = async () => {
        if (!authorizationId) {
          showMissingRequest();
          return;
        }
        sessionStorage.setItem("weekweave_authorization_id", authorizationId);
        const { data: sessionData } = await supabase.auth.getSession();
        if (!sessionData.session) {
          showSignIn();
          return;
        }
        await loadAuthorization();
      };

      main().catch((error) => showError(error?.message ?? "Unable to load the authorization request."));
    </script>
  </body>
</html>
