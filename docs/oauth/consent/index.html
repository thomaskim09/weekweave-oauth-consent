<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://szpdcwgcuygtzsfekqwz.supabase.co; script-src https://esm.sh 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'">
    <title>WeekBloom authorization</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef3f8; color: #1d2433; }
      main { width: min(34rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2rem; border: 1px solid #d5dfeb; border-radius: 1rem; background: #fff; box-shadow: 0 1rem 3rem #1d243326; }
      h1 { margin-top: 0; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: .75rem 1rem; overflow-wrap: anywhere; }
      dt { font-weight: 700; }
      dd { margin: 0; }
      .actions { display: flex; gap: .75rem; margin-top: 1.5rem; }
      button { cursor: pointer; border: 0; border-radius: .6rem; padding: .7rem 1rem; font: inherit; }
      #approve { background: #3867c8; color: white; }
      #deny { background: #dce5ee; color: #1d2433; }
      #status { min-height: 1.5rem; }
      @media (prefers-color-scheme: dark) {
        body { background: #121923; color: #eef3f8; }
        main { border-color: #34465b; background: #1c2735; }
        #deny { background: #34465b; color: #eef3f8; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WeekBloom authorization</h1>
      <p id="status" role="status">Checking your sign-in…</p>
      <section id="details" hidden></section>
      <div id="actions" class="actions"></div>
    </main>
    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const supabase = createClient(
        "https://szpdcwgcuygtzsfekqwz.supabase.co",
        "sb_publishable_DAa2gf9efB81qwdbBI-pVQ_v4o86Tq-",
        { auth: { autoRefreshToken: true, detectSessionInUrl: true, persistSession: true } },
      );
      const url = new URL(location.href);
      const authorizationId = url.searchParams.get("authorization_id") ??
        sessionStorage.getItem("weekweave_authorization_id");
      const status = document.querySelector("#status");
      const details = document.querySelector("#details");
      const actions = document.querySelector("#actions");

      const showError = (message) => {
        status.textContent = message;
        status.style.color = "#a42d35";
      };

      const addDetail = (label, value) => {
        const term = document.createElement("dt");
        term.textContent = label;
        const description = document.createElement("dd");
        description.textContent = value || "Not provided";
        details.append(term, description);
      };

      const decide = async (decision) => {
        actions.querySelectorAll("button").forEach((button) => button.disabled = true);
        status.textContent = decision === "approve" ? "Approving…" : "Denying…";
        const method = decision === "approve" ? "approveAuthorization" : "denyAuthorization";
        const { data, error } = await supabase.auth.oauth[method](authorizationId);
        if (error || !data?.redirect_url) {
          showError(error?.message ?? "The authorization response was incomplete.");
          actions.querySelectorAll("button").forEach((button) => button.disabled = false);
          return;
        }
        sessionStorage.removeItem("weekweave_authorization_id");
        location.replace(data.redirect_url);
      };

      const main = async () => {
        if (!authorizationId) {
          showError("This authorization link is missing its request id.");
          return;
        }
        sessionStorage.setItem("weekweave_authorization_id", authorizationId);

        const { data: sessionData } = await supabase.auth.getSession();
        if (!sessionData.session) {
          status.textContent = "Sign in with Google to review the WeekBloom access request.";
          const signIn = document.createElement("button");
          signIn.id = "approve";
          signIn.textContent = "Continue with Google";
          signIn.addEventListener("click", async () => {
            signIn.disabled = true;
            const { error } = await supabase.auth.signInWithOAuth({
              provider: "google",
              options: { redirectTo: location.href },
            });
            if (error) {
              showError(error.message);
              signIn.disabled = false;
            }
          });
          actions.append(signIn);
          return;
        }

        const { data: authorization, error } =
          await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
        if (error || !authorization) {
          showError(error?.message ?? "This authorization request is invalid or expired.");
          return;
        }
        if (!("authorization_id" in authorization) && authorization.redirect_url) {
          location.replace(authorization.redirect_url);
          return;
        }

        status.textContent = "Review the requested access before continuing.";
        details.hidden = false;
        addDetail("Client", authorization.client?.name);
        addDetail("Redirect URI", authorization.redirect_uri);
        addDetail("Requested scopes", authorization.scope);

        const approve = document.createElement("button");
        approve.id = "approve";
        approve.textContent = "Approve";
        approve.addEventListener("click", () => decide("approve"));
        const deny = document.createElement("button");
        deny.id = "deny";
        deny.textContent = "Deny";
        deny.addEventListener("click", () => decide("deny"));
        actions.append(approve, deny);
      };

      main().catch((error) => showError(error?.message ?? "Unable to load the authorization request."));
    </script>
  </body>
</html>
